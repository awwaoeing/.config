# Kitty Configuration - Migrated from iTerm2
# Generated on 2025-12-05

# ========== 字体配置 ==========
font_family      JetBrainsMonoNLNFP-Bold
bold_font        JetBrainsMonoNLNFP-Bold
italic_font      auto
bold_italic_font auto
font_size        16.0

# 字符间距（对应 iTerm2 的 1.13 spacing）
adjust_line_height  13%
adjust_column_width 13%

# ========== 光标配置 ==========
cursor_shape block
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

# 光标颜色（从 iTerm2 转换）
cursor #bbbbbb
cursor_text_color #ffffff

# ========== 滚动配置 ==========
scrollback_lines 10000
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0

# ========== 鼠标配置 ==========
mouse_hide_wait 3.0
url_color #0059a3
url_style curly
open_url_with default
detect_urls yes
copy_on_select no

# ========== 终端配置 ==========
term xterm-256color
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes

# ========== 窗口布局 ==========
remember_window_size  yes
initial_window_width  80c
initial_window_height 25c
window_padding_width 0
window_margin_width 0

# ========== 配色方案（从 iTerm2 转换）==========
# 背景和前景色
foreground #e6e6e6
background #1e1f28

# 背景透明度（对应 iTerm2 的 58% 透明度）
background_opacity 0.42
background_blur 1

# 选择高亮颜色
selection_foreground #ffffff
selection_background #44475a

# ========== ANSI 颜色配置 ==========
# Black
color0 #000000
color8 #555555

# Red
color1 #ff5555
color9 #ff5555

# Green
color2 #50fa7b
color10 #50fa7b

# Yellow
color3 #f1fa8c
color11 #f1fa8c

# Blue
color4 #bd93f9
color12 #bd93f9

# Magenta
color5 #ff79c6
color13 #ff79c6

# Cyan
color6 #8be9fd
color14 #8be9fd

# White
color7 #bbbbbb
color15 #ffffff

# ========== Tab 标签栏配置 ==========
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_foreground   #282a36
active_tab_background   #f8f8f2
inactive_tab_foreground #f8f8f2
inactive_tab_background #6272a4

# ========== 高级配置 ==========
shell .
editor .
close_on_child_death no
allow_remote_control no
update_check_interval 0

# macOS 特定配置
macos_titlebar_color background
macos_option_as_alt no
macos_hide_from_tasks no
macos_quit_when_last_window_closed no
macos_window_resizable yes
macos_thicken_font 0.75
macos_show_window_title_in all

# ========== 性能优化 ==========
repaint_delay 10
input_delay 3
sync_to_monitor yes

# ========== 连字配置 ==========
# 对应 iTerm2 的 ASCII Ligatures: false
disable_ligatures always

# ========== 快捷键配置 ==========
# 清除默认快捷键，避免冲突
clear_all_shortcuts no

# 基础编辑快捷键
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+n new_os_window
map cmd+w close_window
map cmd+t new_tab
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab

# 字体大小调整
map cmd+equal change_font_size all +2.0
map cmd+minus change_font_size all -2.0
map cmd+0 change_font_size all 0

# 窗口管理
map cmd+enter new_window
map cmd+shift+d close_window

# 搜索
map cmd+f launch --type=overlay --stdin-source=@screen_scrollback /usr/bin/less +G -R
