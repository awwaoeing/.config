# Yazi 主配置文件

# 使用 Catppuccin Mocha 主题（暗色，黄色强调 - 提高可读性）
[flavor]
use = "catppuccin-mocha-yellow"

[mgr]
ratio = [1, 4, 3]
sort_by = "size"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = false
show_symlink = true

[preview]
tab_size = 2
max_width = 1200
max_height = 1800
cache_dir = ""
image_filter = "lanczos3"
image_quality = 90

# ouch 插件 - 压缩文件预览
[plugin]
prepend_previewers = [
	{ mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run = "ouch" },
]

[opener]
edit = [
	{ run = 'nvim "$@"', block = true, desc = "用 Neovim 编辑" },
]
open = [
	{ run = 'open "$@"', desc = "用系统默认程序打开" },
]
reveal = [
	{ run = 'open -R "$@"', desc = "在 Finder 中显示" },
]
yoink = [
	{ run = '~/.config/yazi/scripts/send-to-yoink.sh "$@"', desc = "发送到 Yoink" },
]
extract = [
	{ run = 'ouch d -y "$@"', desc = "用 ouch 解压到当前目录" },
]

[open]
rules = [
	{ name = "*/", use = "open" },
	{ mime = "text/*", use = "edit" },
	{ mime = "image/*", use = "open" },
	{ mime = "video/*", use = "open" },
	{ mime = "audio/*", use = "open" },
	{ mime = "*", use = "open" },
]

[tasks]
micro_workers = 10
macro_workers = 25
bizarre_retry = 5
image_alloc = 536870912
image_bound = [0, 0]

[input]
cursor_blink = true

[log]
enabled = false
