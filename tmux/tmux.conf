#解绑tmux启动命令C-b，换为C-a
#使用  C-a来启动tmux才能用快捷指令如分割pane
unbind C-b
set -g prefix C-a  # 设置 Ctrl + a 为新的前缀键
set -g mouse on # 启用鼠标(Tmux v2.1)
setw -g mode-keys vi

# 设置默认 shell 为 zsh (修复 Oh-My-Zsh 加载错误)
set -g default-shell /bin/zsh
set -g default-command /bin/zsh

# 历史缓冲区大小 (用于查看长训练日志)
set -g history-limit 50000

# ============ 状态栏配置 ============
set -g status off                       # 禁用状态栏
set -g status-interval 2                # 每2秒刷新一次 (用于网速监控)
set -g status-position bottom           # 状态栏位置：底部
set -g status-justify left              # 窗口列表左对齐

# 状态栏颜色
set -g status-style bg=#2e3440,fg=#d8dee9

# 左侧状态栏：[会话名] Git分支 Conda环境
set -g status-left-length 60
set -g status-left "#[bg=#5e81ac,fg=#eceff4,bold] #S #[bg=#2e3440,fg=#5e81ac] #[fg=#a3be8c]#(~/.config/tmux/scripts/git_branch.sh) #[fg=#d08770]#(~/.config/tmux/scripts/conda_env.sh) "

# 右侧状态栏：网速 | CPU | GPU | 日期时间
set -g status-right-length 100
set -g status-right "#[fg=#4c566a]#[bg=#4c566a,fg=#d8dee9] #(~/.config/tmux/scripts/net_speed.sh) #[fg=#4c566a]#[bg=#4c566a,fg=#d8dee9] #(~/.config/tmux/scripts/cpu_usage.sh) #[fg=#4c566a]#[bg=#4c566a,fg=#d8dee9] #(~/.config/tmux/scripts/gpu_info.sh) #[fg=#5e81ac]#[bg=#5e81ac,fg=#eceff4] %m-%d %H:%M "

# 窗口状态样式
set -g window-status-format "#[fg=#4c566a,bg=#2e3440] #I:#W "
set -g window-status-current-format "#[bg=#88c0d0,fg=#2e3440,bold] #I:#W "
set -g window-status-separator ""


# ============ TPM 插件管理器配置 ============
# 插件列表
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'erikw/tmux-powerline'  # 已禁用 - 不使用状态栏
set -g @plugin 'tmux-plugins/tmux-yank'  # 更好的复制功能
set -g @plugin 'tmux-plugins/tmux-resurrect'  # 会话保存/恢复
set -g @plugin 'tmux-plugins/tmux-continuum'  # 自动保存会话

# tmux-powerline 配置
# set-environment -g TMUX_POWERLINE_THEME "training"  # 已禁用


#更好的颜色支持： screen-256color 比默认的 screen 终端类型提供更多的颜色选择
set -g default-terminal "screen-256color"


#快捷reload 配置完.tmux.conf文件后使用 C-a + r 快捷替代tmux source ~/.tmux.conf
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded........"

#方向键
bind -r k select-pane -U # 绑定k为↑
bind -r j select-pane -D # 绑定j为↓
bind -r h select-pane -L # 绑定h为<-
bind -r l select-pane -R # 绑定l为->


#分割pane。C-a - 水平方向新增面板，C-b / 垂直方向新增面板
unbind '"'
bind - splitw -v -c '#{pane_current_path}' # 垂直方向新增面板，默认进入当前目录
unbind %
bind / splitw -h -c '#{pane_current_path}' # 水平方向新增面板，默认进入当前目录


#会话窗口计数
# 会话计数：从 1 开始（Setting base-index assures newly created windows start at 1 and count upwards）
set -g base-index 1
# 窗口计数：从 1 开始编号，而不是从 0 开始
set -g pane-base-index 1



# ============ 交换tmux窗格的位置 ============
# 使用 Shift + jk 上下交换窗格
bind-key J swap-pane -D \; display-message "Swapped Down"
bind-key K swap-pane -U \; display-message "Swapped Up"
# 注意: swap-pane 不支持 -L/-R 参数
# 如需左右交换,需要使用 select-pane 和手动交换逻辑


# ============ 快速训练布局 ============
# C-a 1: 双栏布局 (代码 | 训练日志)
bind-key 1 run-shell "~/.config/tmux/layouts/training-dual.sh"
# C-a 2: 三栏监控布局 (训练 | GPU | CPU)
bind-key 2 run-shell "~/.config/tmux/layouts/training-monitor.sh"
# C-a 3: 四栏全功能布局 (代码|训练 / 日志|监控)
bind-key 3 run-shell "~/.config/tmux/layouts/training-full.sh"


# ============ macOS 系统剪贴板集成 ============
# 在tmux中复制内容到系统剪切板：C-a + [ 进入复制模式，拖拽鼠标选择要复制的内容
# 使用 tmux-yank 插件自动处理复制到系统剪贴板（已在上面的插件列表中声明）
#
# 手动配置（如果 tmux-yank 不起作用）：
# 当你进入 tmux 的复制模式 (C-a + [) 并开始用鼠标左键在窗格内拖动选择文本时，tmux 会进入 copy-mode-vi 模式
# 当你释放鼠标左键，停止拖动时，MouseDragEnd1Pane 事件被触发
# tmux 首先执行 send-keys -X copy-selection-and-cancel 命令，将选择的文本复制到 tmux 缓冲区并退出复制模式
# tmux 然后执行 run "tmux save-buffer - | pbcopy" 命令，将缓冲区内容复制到系统剪贴板
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel \; run "tmux save-buffer - | pbcopy"
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel \; run "tmux save-buffer - | pbcopy"


# ============ 会话持久化配置 (tmux-resurrect + tmux-continuum) ============
# resurrect 配置
set -g @resurrect-strategy-vim 'session'  # 恢复 vim 会话
set -g @resurrect-strategy-nvim 'session'  # 恢复 neovim 会话
set -g @resurrect-capture-pane-contents 'on'  # 恢复窗格内容
set -g @resurrect-dir '~/.config/tmux/resurrect'  # 保存目录

# continuum 配置
set -g @continuum-save-interval '15'  # 每15分钟自动保存
set -g @continuum-restore 'off'  # 不自动恢复 (手动恢复更安全)

# 手动保存/恢复快捷键 (由 resurrect 提供):
# C-a + Ctrl+s  保存会话
# C-a + Ctrl+r  恢复会话


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'  #这条命令主要用于初始化 tmux 插件管理器 TPM
